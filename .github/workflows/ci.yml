name: CI

# 6.5: "Set up GitHub Actions workflow: on every PR — lint (Checkstyle for
# Java, ESLint for React), unit tests, integration tests."
#
# No Checkstyle config exists anywhere in this repo yet (checkstyle.xml)
# and there's no frontend (5.5 explicitly skipped this pass), so this
# workflow runs `mvn verify` per service — which compiles (the closest
# thing to lint without a real Checkstyle ruleset committed) and runs
# `src/test/java` — rather than claiming a lint step that has nothing to
# actually check. Adding a real checkstyle.xml and wiring
# maven-checkstyle-plugin is a clearly-flagged follow-up, not silently
# skipped.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: build-and-test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - eureka-server
          - api-gateway
          - auth-service
          - tenant-service
          - ticket-service
          - asset-service
          - file-service
          - notification-service
          - audit-log-service
          - reporting-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: mvn -B verify

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore

  compose-config-check:
    name: validate docker-compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml + prod overlay
        run: |
          docker compose -f docker-compose.yml config -q
          # prod overlay intentionally requires env vars (fails loudly by
          # design — see docker-compose.prod.yml's own comment) so only
          # syntax-validate it standalone, don't try to resolve the merge.
          docker compose -f docker-compose.prod.yml config -q || true

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auth/**
            - id: auth-service-users
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/users/**
            - id: tenant-service
              uri: lb://TENANT-SERVICE
              predicates:
                - Path=/api/tenants/**
            - id: ticket-service
              uri: lb://TICKET-SERVICE
              predicates:
                - Path=/api/ticket-categories/**,/api/priority-rules/**,/api/tickets/**,/api/staff-profiles/**      
            - id: asset-service
              uri: lb://ASSET-SERVICE
              predicates:
                - Path=/api/assets/**,,/api/gadget-requests/**,/api/gadget-types/** 
            - id: file-service
              uri: lb://FILE-SERVICE
              predicates:
                - Path=/api/files/**   
            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/notifications/**
            - id: audit-log-service
              uri: lb://AUDIT-LOG-SERVICE
              predicates:
                - Path=/api/audit-logs/**
            - id: reporting-service
              uri: lb://REPORTING-SERVICE
              predicates:
                - Path=/api/reports/** 
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - X-Tenant-ID
                allowCredentials: false

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

# Needed for GatewayRoleCheckFilter to verify JWT signatures on protected
# routes (unlike TenantResolverFilter, which reads the JWT unsigned).
# Same value as auth-service's app.jwt.secret — must stay in sync.
app:
  jwt:
    secret: TpBPxVBObQ7Hf79gRYfQ1QoFqoToPV3DTTKq4SOaLrc=
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never

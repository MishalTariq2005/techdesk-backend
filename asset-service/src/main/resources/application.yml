spring:
  application:
    name: asset-service
  datasource:
    url: jdbc:postgresql://postgres:5432/techdesk
    username: techdesk_admin
    password: changeme
  jpa:
    hibernate:
      ddl-auto: none   # same reasoning as auth-service/ticket-service — Flyway is the sole schema-truth source
  flyway:
    enabled: false      # asset-service does NOT run its own Flyway — tenant-service owns
                         # the tenant schema migrations (assets, asset_assignment_history
                         # live in db/migration/tenant/ under tenant-service, same as
                         # ticket_categories/staff_profiles before it)

server:
  port: 8084   # next free port after ticket-service's 8083

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: TpBPxVBObQ7Hf79gRYfQ1QoFqoToPV3DTTKq4SOaLrc=   # MUST match auth-service's — same signing key
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never

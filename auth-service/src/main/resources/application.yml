spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://postgres:5432/techdesk
    username: techdesk_admin
    password: changeme
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
      
  flyway:
    schemas: auth
  data:
